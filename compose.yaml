services:
  postgres:
    image: postgres:17.7
    environment:
      POSTGRES_DB: financial
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial -d financial"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - financial-data:/var/lib/postgresql/data

volumes:
  financial-data:
